name: "SSCA Repository SBOM Generation (V2)"
description: "Generate an SBOM from a source-code repository via GitHub Actions on the SSCA V2 design (SOURCE_TYPE=repository)"
inputs:
  plugin_image:
    description: "Plugin Docker image built from ssca-plugins (V2 github subcommands)"
    required: false
    default: "harness/ssca-plugin:test-githubV2"
  harness_account_url:
    required: true
  harness_api_key:
    required: true
  harness_account_id:
    required: true
  harness_org_id:
    required: true
  harness_project_id:
    required: true
  ssca_service_endpoint:
    required: false
  ssca_service_token:
    required: false
  repo_url:
    description: "Repository URL (defaults to the current GitHub repository)"
    required: false
  repo_path:
    description: "Repository path/name (defaults to GITHUB_REPOSITORY)"
    required: false
  repo_variant:
    description: "Branch/tag/commit (defaults to the current ref)"
    required: false
  repo_variant_type:
    description: "branch | tag | commit"
    required: false
    default: "branch"
  cloned_codebase:
    description: "Path to the checked-out codebase (e.g. the actions/checkout workspace)"
    required: false
  sbom_tool:
    required: false
    default: "Syft"
  sbom_format:
    required: false
    default: "cyclonedx-json"
  sbom_destination:
    required: false
    default: "/tmp/sbom"
  attest_sbom:
    required: false
    default: "false"
  cosign_private_key:
    required: false
  cosign_password:
    required: false
  keyless_type:
    required: false
  vault_address:
    required: false
  vault_token:
    required: false
  kms_key:
    required: false
runs:
  using: "composite"
  steps:
    - name: SSCA Repository SBOM Generation (V2)
      shell: bash
      env:
        HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
        HARNESS_API_KEY: ${{ inputs.harness_api_key }}
        HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
        HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
        HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
        HARNESS_SSCA_SERVICE_ENDPOINT: ${{ inputs.ssca_service_endpoint }}
        HARNESS_SSCA_SERVICE_TOKEN: ${{ inputs.ssca_service_token }}
        SOURCE_TYPE: "repository"
        # Repo metadata: fall back to GitHub Actions context when inputs are unset.
        REPO_URL: ${{ inputs.repo_url || format('{0}/{1}', github.server_url, github.repository) }}
        REPO_PATH: ${{ inputs.repo_path || github.repository }}
        REPO_VARIANT: ${{ inputs.repo_variant || github.ref_name }}
        REPO_VARIANT_TYPE: ${{ inputs.repo_variant_type }}
        REPO_CLONED_CODEBASE: ${{ inputs.cloned_codebase || github.workspace }}
        SBOM_TOOL: ${{ inputs.sbom_tool }}
        SBOM_FORMAT: ${{ inputs.sbom_format }}
        PLUGIN_SBOMDESTINATION: ${{ inputs.sbom_destination }}
        PLUGIN_MODE: "generation"
        ATTEST_SBOM: ${{ inputs.attest_sbom }}
        SSCA_ORCHESTRATION_COSIGN_PRIVATE_KEY: ${{ inputs.cosign_private_key }}
        SSCA_ORCHESTRATION_COSIGN_PASSWORD: ${{ inputs.cosign_password }}
        PLUGIN_KEYLESS_TYPE: ${{ inputs.keyless_type }}
        VAULT_ADDR: ${{ inputs.vault_address }}
        VAULT_TOKEN: ${{ inputs.vault_token }}
        KMS_KEY: ${{ inputs.kms_key }}
      run: |
        set -euo pipefail
        if [ "${PLUGIN_KEYLESS_TYPE:-}" = "non-harness" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "keyless signing requires 'permissions: id-token: write' in the calling workflow" >&2
            exit 1
          fi
          PLUGIN_NON_HARNESS_OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harness-fulcio" | jq -r '.value')"
          export PLUGIN_NON_HARNESS_OIDC_TOKEN
        fi
        PLUGIN_IMAGE="${{ inputs.plugin_image }}"
        ENV_FILE="$(mktemp)"
        env | grep -E '^(HARNESS_|GITHUB_|SBOM_|SOURCE_|PLUGIN_|SSCA_|VAULT_|DOCKER_|ATTEST_|POLICY_|VERIFY_|REPO_|SLSA_|REGISTRY_|KMS_|GCP_|RUNNER_|ACTIONS_ID_TOKEN|OIDC_|FULCIO_)' > "$ENV_FILE" || true
        if [ -n "${PLUGIN_NON_HARNESS_OIDC_TOKEN:-}" ]; then
          echo "PLUGIN_NON_HARNESS_OIDC_TOKEN=${PLUGIN_NON_HARNESS_OIDC_TOKEN}" >> "$ENV_FILE"
        fi
        EXTRA_DOCKER_ARGS=()
        if [ -S /var/run/docker.sock ]; then
          EXTRA_DOCKER_ARGS+=(-v /var/run/docker.sock:/var/run/docker.sock)
        fi
        docker run --rm \
          "${EXTRA_DOCKER_ARGS[@]}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" \
          --env-file "$ENV_FILE" \
          --entrypoint /bin/ssca-plugin \
          "$PLUGIN_IMAGE" \
          github-orchestrate
