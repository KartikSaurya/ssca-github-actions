name: "SLSA Provenance Verification (V2)"
description: "Verify SLSA provenance attestation via GitHub Actions on the SLSA V2 design"
inputs:
  plugin_image:
    description: "Plugin Docker image built from ssca-plugins (V2 github subcommands)"
    required: false
    default: "harness/slsa-plugin:test-githubV2"
  harness_account_url:
    required: true
  harness_api_key:
    required: true
  harness_account_id:
    required: true
  harness_org_id:
    required: true
  harness_project_id:
    required: true
  ssca_service_endpoint:
    required: false
  ssca_service_token:
    required: false
  slsa_source:
    description: "Container image / artifact to verify provenance for"
    required: true
  registry_type:
    required: false
    default: "docker"
  verify_slsa:
    required: false
    default: "true"
  cosign_public_key:
    required: false
  keyless_type:
    required: false
  docker_username:
    required: false
  docker_password:
    required: false

  workspace:
    description: "File path for non-container artifacts (SOURCE_TYPE=local)"
    required: false
  artifact_name:
    description: "Non-container artifact name (optional; auto-derived from workspace if unset)"
    required: false
  local_file_version:
    description: "Version label for non-container artifacts"
    required: false

  kms_key:
    description: "HashiCorp Vault transit key path for cosign (same as V1 KMS_KEY)"
    required: false
  vault_address:
    required: false
  vault_token:
    required: false
runs:
  using: "composite"
  steps:
    - name: SLSA Provenance Verification (V2)
      shell: bash
      env:
        HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
        HARNESS_API_KEY: ${{ inputs.harness_api_key }}
        HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
        HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
        HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
        HARNESS_SSCA_SERVICE_ENDPOINT: ${{ inputs.ssca_service_endpoint }}
        HARNESS_SSCA_SERVICE_TOKEN: ${{ inputs.ssca_service_token }}
        SLSA_SOURCE: ${{ inputs.slsa_source }}
        PLUGIN_REGISTRY_TYPE: ${{ inputs.registry_type }}
        VERIFY_SLSA: ${{ inputs.verify_slsa }}
        SSCA_SLSA_VERIFICATION_COSIGN_PUBLIC_KEY: ${{ inputs.cosign_public_key }}
        PLUGIN_KEYLESS_TYPE: ${{ inputs.keyless_type }}
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
        PLUGIN_WORKSPACE: ${{ inputs.workspace }}
        ARTIFACT_WORKSPACE: ${{ inputs.workspace }}
        PLUGIN_NON_CONTAINER_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        PLUGIN_LOCAL_FILE_VERSION: ${{ inputs.local_file_version }}
        ARTIFACT_VERSION: ${{ inputs.local_file_version }}
      run: |
        set -euo pipefail
        if [ "${PLUGIN_KEYLESS_TYPE:-}" = "non-harness" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "keyless verification requires 'permissions: id-token: write' in the calling workflow" >&2
            exit 1
          fi
          PLUGIN_NON_HARNESS_OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harness-fulcio" | jq -r '.value')"
          export PLUGIN_NON_HARNESS_OIDC_TOKEN
        fi
        PLUGIN_IMAGE="${{ inputs.plugin_image }}"
        ENV_FILE="$(mktemp)"
        env | grep -E '^(HARNESS_|GITHUB_|SBOM_|SOURCE_|PLUGIN_|SSCA_|VAULT_|DOCKER_|ATTEST_|POLICY_|VERIFY_|REPO_|SLSA_|REGISTRY_|KMS_|GCP_|RUNNER_|ACTIONS_ID_TOKEN|OIDC_)' > "$ENV_FILE" || true
        if [ -n "${PLUGIN_NON_HARNESS_OIDC_TOKEN:-}" ]; then
          echo "PLUGIN_NON_HARNESS_OIDC_TOKEN=${PLUGIN_NON_HARNESS_OIDC_TOKEN}" >> "$ENV_FILE"
        fi
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" \
          --env-file "$ENV_FILE" \
          --entrypoint /bin/slsa-plugin \
          "$PLUGIN_IMAGE" \
          github-slsa-verification
