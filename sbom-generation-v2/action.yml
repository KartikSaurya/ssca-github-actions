name: "SSCA SBOM Generation (V2)"
description: "Generate and attest an SBOM via GitHub Actions on the SSCA V2 platform-agnostic design"
inputs:
  plugin_image:
    description: "Plugin Docker image built from ssca-plugins (V2 github subcommands)"
    required: false
    default: "harness/ssca-plugin:prod"
  harness_account_url:
    description: "Harness account URL"
    required: true
  harness_api_key:
    description: "Harness API key"
    required: true
  harness_account_id:
    required: true
  harness_org_id:
    required: true
  harness_project_id:
    required: true
  ssca_service_endpoint:
    description: "SSCA manager endpoint"
    required: false
  ssca_service_token:
    description: "SSCA service token"
    required: false
  sbom_source:
    description: "Artifact source, e.g. node:alpine"
    required: true
  source_type:
    description: "image | repository | local"
    required: false
    default: "image"
  sbom_tool:
    description: "Syft | cdxgen"
    required: false
    default: "Syft"
  sbom_format:
    description: "spdx-json | cyclonedx-json"
    required: false
    default: "cyclonedx-json"
  sbom_destination:
    required: false
    default: "/tmp/sbom"
  attest_sbom:
    required: false
    default: "true"
  # Signing (choose one method)
  cosign_private_key:
    required: false
  cosign_password:
    required: false
  keyless_type:
    description: 'Set to "non-harness" for GitHub OIDC keyless signing'
    required: false
  vault_address:
    required: false
  vault_token:
    required: false
  vault_key_path:
    required: false
  # Registry credentials
  docker_username:
    required: false
  docker_password:
    required: false
runs:
  using: "composite"
  steps:
    - name: SSCA SBOM Generation (V2)
      shell: bash
      env:
        HARNESS_ACCOUNT_URL: ${{ inputs.harness_account_url }}
        HARNESS_API_KEY: ${{ inputs.harness_api_key }}
        HARNESS_ACCOUNT_ID: ${{ inputs.harness_account_id }}
        HARNESS_ORG_ID: ${{ inputs.harness_org_id }}
        HARNESS_PROJECT_ID: ${{ inputs.harness_project_id }}
        HARNESS_SSCA_SERVICE_ENDPOINT: ${{ inputs.ssca_service_endpoint }}
        HARNESS_SSCA_SERVICE_TOKEN: ${{ inputs.ssca_service_token }}
        SBOM_SOURCE: ${{ inputs.sbom_source }}
        SOURCE_TYPE: ${{ inputs.source_type }}
        SBOM_TOOL: ${{ inputs.sbom_tool }}
        SBOM_FORMAT: ${{ inputs.sbom_format }}
        PLUGIN_SBOMDESTINATION: ${{ inputs.sbom_destination }}
        PLUGIN_MODE: "generation"
        ATTEST_SBOM: ${{ inputs.attest_sbom }}
        SSCA_ORCHESTRATION_COSIGN_PRIVATE_KEY: ${{ inputs.cosign_private_key }}
        SSCA_ORCHESTRATION_COSIGN_PASSWORD: ${{ inputs.cosign_password }}
        PLUGIN_KEYLESS_TYPE: ${{ inputs.keyless_type }}
        VAULT_ADDR: ${{ inputs.vault_address }}
        VAULT_TOKEN: ${{ inputs.vault_token }}
        VAULT_COSIGN_KEY_PATH: ${{ inputs.vault_key_path }}
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
      run: |
        set -euo pipefail
        # Keyless signing: export the GitHub OIDC token for the non-Harness flow.
        if [ "${PLUGIN_KEYLESS_TYPE:-}" = "non-harness" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "keyless signing requires 'permissions: id-token: write' in the calling workflow" >&2
            exit 1
          fi
          PLUGIN_NON_HARNESS_OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harness-fulcio" | jq -r '.value')"
          export PLUGIN_NON_HARNESS_OIDC_TOKEN
        fi
        PLUGIN_IMAGE="${{ inputs.plugin_image }}"
        ENV_FILE="$(mktemp)"
        env | grep -E '^(HARNESS_|GITHUB_|SBOM_|SOURCE_|PLUGIN_|SSCA_|VAULT_|DOCKER_|ATTEST_|POLICY_|VERIFY_|REPO_|SLSA_|REGISTRY_|KMS_|GCP_|RUNNER_|ACTIONS_ID_TOKEN|OIDC_)' > "$ENV_FILE" || true
        if [ -n "${PLUGIN_NON_HARNESS_OIDC_TOKEN:-}" ]; then
          echo "PLUGIN_NON_HARNESS_OIDC_TOKEN=${PLUGIN_NON_HARNESS_OIDC_TOKEN}" >> "$ENV_FILE"
        fi
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" \
          --env-file "$ENV_FILE" \
          --entrypoint /bin/ssca-plugin \
          "$PLUGIN_IMAGE" \
          github-orchestrate
