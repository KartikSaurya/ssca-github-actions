# Sign and verify a non-container file (SOURCE_TYPE=local) with Vault KMS (KMS_KEY).
name: "V2 Non-Container — Artifact Sign + Verify (Vault KMS)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-container-sign-vault:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_SSCA_SERVICE_ENDPOINT: ${{ vars.HARNESS_SSCA_SERVICE_ENDPOINT }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      ARTIFACT_SIGNING_PLUGIN_IMAGE: harness/ssca-artifact-signing-plugin:test-githubV2
      KMS_KEY: ${{ vars.KMS_KEY }}
      LOCAL_ARTIFACT: ${{ github.workspace }}/artifacts/scs-sample-app.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare non-container sample artifact
        uses: ./.github/actions/prepare-non-container-artifact

      - name: Configure Vault for plugins
        uses: ./.github/actions/export-vault-env
        with:
          vault_addr: ${{ secrets.VAULT_ADDR }}
          vault_token: ${{ secrets.VAULT_TOKEN }}

      - name: Sign non-container artifact (Vault KMS)
        uses: ./v2/artifact-signing-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          ssca_service_endpoint: ${{ env.HARNESS_SSCA_SERVICE_ENDPOINT }}
          registry_type: local
          signing_source: ${{ env.LOCAL_ARTIFACT }}
          workspace: ${{ env.LOCAL_ARTIFACT }}
          artifact_name: scs-sample-app.zip
          local_file_version: v1
          vault_address: ${{ secrets.VAULT_ADDR }}
          vault_token: ${{ env.VAULT_TOKEN }}
          kms_key: ${{ env.KMS_KEY != '' && env.KMS_KEY || 'SSCA_AUTOMATION_COSIGN_KEY' }}

      - name: Verify non-container artifact (Vault KMS)
        uses: ./v2/artifact-verification-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          ssca_service_endpoint: ${{ env.HARNESS_SSCA_SERVICE_ENDPOINT }}
          registry_type: local
          signing_source: ${{ env.LOCAL_ARTIFACT }}
          workspace: ${{ env.LOCAL_ARTIFACT }}
          artifact_name: scs-sample-app.zip
          vault_address: ${{ secrets.VAULT_ADDR }}
          vault_token: ${{ env.VAULT_TOKEN }}
          kms_key: ${{ env.KMS_KEY != '' && env.KMS_KEY || 'SSCA_AUTOMATION_COSIGN_KEY' }}
