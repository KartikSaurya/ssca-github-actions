name: DevSecOps V2 (SLSA + SBOM + Policy)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  devsecops-v2:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      SSCA_PLUGIN_IMAGE: ${{ vars.SSCA_PLUGIN_IMAGE || 'harness/ssca-plugin:prod' }}
      SLSA_PLUGIN_IMAGE: ${{ vars.SLSA_PLUGIN_IMAGE || 'harness/slsa-plugin:prod' }}
      ARTIFACT_IMAGE: ${{ vars.DEVSECOPS_TARGET_IMAGE || 'reetika1999/devsecops:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Optional Vault login
        if: ${{ secrets.VAULT_URL != '' }}
        uses: hashicorp/vault-action@v3
        id: vault_login
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}

      - name: Export Vault env
        if: ${{ secrets.VAULT_URL != '' }}
        run: |
          echo "VAULT_ADDR=${{ secrets.VAULT_URL }}" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=${{ steps.vault_login.outputs.token }}" >> "$GITHUB_ENV"

      - name: SLSA provenance (V2)
        uses: ./slsa-generation-v2
        with:
          plugin_image: ${{ env.SLSA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          slsa_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          attest_slsa: "false"
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          vault_key_path: cosign

      - name: SBOM generation (V2)
        uses: ./sbom-generation-v2
        with:
          plugin_image: ${{ env.SSCA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          sbom_source: ${{ env.ARTIFACT_IMAGE }}
          source_type: image
          sbom_tool: Syft
          sbom_format: spdx-json
          attest_sbom: "false"
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          vault_key_path: cosign
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM policy enforcement (V2)
        uses: ./sbom-policy-enforcement-v2
        with:
          plugin_image: ${{ env.SSCA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          sbom_source: ${{ env.ARTIFACT_IMAGE }}
          source_type: image
          verify_sbom: "false"
          policy_set_ref: ${{ vars.OPA_POLICY_SET_REF }}
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
