# Container E2E on QA — harness/github-actions marketplace composites (keyless OIDC).
# Pin: use @1.2.0 after release; until then @SSCA-8414 matches harness/github-actions branch.
name: "container-keyless"

on:
  workflow_dispatch:
    inputs:
      attest:
        description: "Run keyless attestation and corresponding verification steps"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FULCIO_URL: ${{ vars.FULCIO_QA_URL }}

jobs:
  ssca:
    name: ssca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM generation (orchestrate)
        uses: harness/github-actions/sbom-generation@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_TOOL: ${{ vars.SBOM_TOOL }}
          SBOM_FORMAT: ${{ vars.SBOM_FORMAT }}
          SOURCE_TYPE: docker
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          PLUGIN_SBOMDESTINATION: ${{ vars.SBOM_LOCAL_PATH }}
          ATTEST_SBOM: ${{ inputs.attest }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve SBOM file for ingestion
        env:
          SBOM_LOCAL_PATH: ${{ vars.SBOM_LOCAL_PATH }}
        run: |
          SBOM_FILE="$(ls -t "$SBOM_LOCAL_PATH"/sbom_*.json 2>/dev/null | head -1)"
          if [ -z "$SBOM_FILE" ]; then
            echo "No SBOM file under $SBOM_LOCAL_PATH" >&2
            exit 1
          fi
          echo "INGESTION_SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: SBOM ingestion (orchestrate)
        uses: harness/github-actions/sbom-ingestion@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          PLUGIN_SBOMDESTINATION: ${{ env.INGESTION_SBOM_FILE }}
          ATTEST_SBOM: ${{ inputs.attest }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM policy enforcement (enforce)
        uses: harness/github-actions/sbom-policy-enforcement@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SBOM_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          VERIFY_SBOM: ${{ inputs.attest }}
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  slsa:
    name: slsa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SLSA provenance (attest)
        uses: harness/github-actions/slsa-generation@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SLSA_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          ATTEST_SLSA: ${{ inputs.attest }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: SLSA verification
        if: ${{ inputs.attest }}
        uses: harness/github-actions/slsa-verification@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SLSA_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          VERIFY_SLSA: "true"
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  artifact-signing:
    name: artifact-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Artifact signing
        uses: harness/github-actions/artifact-signing@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SIGNING_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Artifact verification
        uses: harness/github-actions/artifact-verification@SSCA-8414
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: docker
          SIGNING_SOURCE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
          OIDC_PROVIDER: non-harness
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
