# Non-container E2E on QA — harness/github-actions (Vault KMS). Pin @1.2.0 after release.
name: "non-container-kms"

on:
  workflow_dispatch:
    inputs:
      attest:
        description: "Run KMS attestation and corresponding verification steps"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  LOCAL_ARTIFACT: ${{ github.workspace }}/artifacts/scs-sample-app.zip

jobs:
  ssca:
    name: ssca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact

      - name: SBOM generation (orchestrate)
        uses: harness/github-actions/sbom-generation@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SBOM_TOOL: ${{ vars.SBOM_TOOL }}
          SBOM_FORMAT: ${{ vars.SBOM_FORMAT }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          PLUGIN_SBOMDESTINATION: ${{ vars.SBOM_LOCAL_PATH }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          ATTEST_SBOM: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

      - name: Resolve SBOM file for ingestion
        env:
          SBOM_LOCAL_PATH: ${{ vars.SBOM_LOCAL_PATH }}
        run: |
          SBOM_FILE="$(ls -t "$SBOM_LOCAL_PATH"/sbom_*.json 2>/dev/null | head -1)"
          if [ -z "$SBOM_FILE" ]; then
            echo "No SBOM file under $SBOM_LOCAL_PATH" >&2
            exit 1
          fi
          echo "INGESTION_SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: SBOM ingestion (orchestrate)
        uses: harness/github-actions/sbom-ingestion@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          PLUGIN_SBOMDESTINATION: ${{ env.INGESTION_SBOM_FILE }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          ATTEST_SBOM: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

      - name: SBOM policy enforcement (enforce)
        uses: harness/github-actions/sbom-policy-enforcement@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SBOM_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          VERIFY_SBOM: ${{ inputs.attest }}
          POLICY_SET_REF: ${{ vars.OPA_QA_POLICY_SET_REF }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

  slsa:
    name: slsa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact

      - name: SLSA provenance (attest)
        uses: harness/github-actions/slsa-generation@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          ATTEST_SLSA: ${{ inputs.attest }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

      - name: SLSA verification
        if: ${{ inputs.attest }}
        uses: harness/github-actions/slsa-verification@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SLSA_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          VERIFY_SLSA: "true"
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

  artifact-signing:
    name: artifact-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-non-container-artifact

      - name: Artifact signing
        uses: harness/github-actions/artifact-signing@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}

      - name: Artifact verification
        uses: harness/github-actions/artifact-verification@main
        with:
          HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_QA_ACCOUNT_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_QA_API_KEY }}
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_QA_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_QA_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_QA_PROJECT_ID }}
          SOURCE_TYPE: local
          SIGNING_SOURCE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_WORKSPACE: ${{ env.LOCAL_ARTIFACT }}
          ARTIFACT_NAME: scs-sample-app.zip
          ARTIFACT_VERSION: v1
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KMS_KEY: ${{ vars.KMS_KEY }}
