name: Artifact signing and verification (V2)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign-verify:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      ARTIFACT_SIGNING_PLUGIN_IMAGE: ${{ vars.ARTIFACT_SIGNING_PLUGIN_IMAGE || 'harness/ssca-artifact-signing-plugin:prod' }}
      ARTIFACT_IMAGE: ${{ vars.DEVSECOPS_TARGET_IMAGE || 'reetika1999/devsecops:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign artifact (V2)
        uses: ./artifact-signing-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          signing_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify artifact (V2)
        uses: ./artifact-verification-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          signing_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
