# Container image DevSecOps using HashiCorp Vault transit KMS for cosign (not GCP KMS).
# Flow: SLSA provenance → SBOM generation → SBOM policy enforcement.
name: "V2 Container — SLSA + SBOM + Enforce (Vault KMS)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-kms-devsecops:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      SSCA_PLUGIN_IMAGE: harness/ssca-plugin:test-githubV2
      SLSA_PLUGIN_IMAGE: harness/slsa-plugin:test-githubV2
      ARTIFACT_IMAGE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}
      KMS_KEY: ${{ vars.KMS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Vault
        uses: hashicorp/vault-action@v3
        id: vault_login
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}

      - name: Export Vault environment for plugins
        run: |
          echo "VAULT_ADDR=${{ secrets.VAULT_URL }}" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=${{ steps.vault_login.outputs.token }}" >> "$GITHUB_ENV"

      - name: SLSA provenance with Vault KMS
        uses: ./slsa-generation-v2
        with:
          plugin_image: ${{ env.SLSA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          slsa_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          attest_slsa: ${{ vars.ATTEST_SLSA || 'false' }}
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          kms_key: ${{ env.KMS_KEY != '' && env.KMS_KEY || 'cosign' }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM generation with Vault KMS
        uses: ./sbom-generation-v2
        with:
          plugin_image: ${{ env.SSCA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          sbom_source: ${{ env.ARTIFACT_IMAGE }}
          source_type: image
          sbom_tool: ${{ vars.SBOM_TOOL || 'Syft' }}
          sbom_format: ${{ vars.SBOM_FORMAT || 'spdx-json' }}
          attest_sbom: ${{ vars.ATTEST_SBOM || 'false' }}
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          kms_key: ${{ env.KMS_KEY != '' && env.KMS_KEY || 'cosign' }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: SBOM policy enforcement with Vault KMS
        uses: ./sbom-policy-enforcement-v2
        with:
          plugin_image: ${{ env.SSCA_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          sbom_source: ${{ env.ARTIFACT_IMAGE }}
          source_type: image
          verify_sbom: ${{ vars.VERIFY_SBOM || 'false' }}
          policy_set_ref: ${{ vars.OPA_POLICY_SET_REF }}
          vault_address: ${{ secrets.VAULT_URL }}
          vault_token: ${{ env.VAULT_TOKEN }}
          kms_key: ${{ env.KMS_KEY != '' && env.KMS_KEY || 'cosign' }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
