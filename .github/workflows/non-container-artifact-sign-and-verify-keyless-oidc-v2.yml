# Sign and verify a non-container file with GitHub OIDC keyless signing.
name: "V2 Non-Container — Artifact Sign + Verify (Keyless OIDC)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  non-container-sign-keyless:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      ARTIFACT_SIGNING_PLUGIN_IMAGE: ${{ vars.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
      NON_CONTAINER_WORKSPACE: ${{ vars.NON_CONTAINER_WORKSPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign non-container artifact (Keyless OIDC)
        uses: ./artifact-signing-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          registry_type: local
          signing_source: ${{ env.NON_CONTAINER_WORKSPACE }}
          workspace: ${{ env.NON_CONTAINER_WORKSPACE }}
          artifact_name: ${{ vars.NON_CONTAINER_ARTIFACT_NAME }}
          local_file_version: ${{ vars.NON_CONTAINER_ARTIFACT_VERSION }}
          keyless_type: non-harness

      - name: Verify non-container artifact (Keyless OIDC)
        uses: ./artifact-verification-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          registry_type: local
          signing_source: ${{ env.NON_CONTAINER_WORKSPACE }}
          workspace: ${{ env.NON_CONTAINER_WORKSPACE }}
          artifact_name: ${{ vars.NON_CONTAINER_ARTIFACT_NAME }}
          keyless_type: non-harness
