# Sign and verify a container image using GitHub OIDC keyless signing (Fulcio).
name: "V2 Container — Artifact Sign + Verify (Keyless OIDC)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  keyless-oidc-sign-verify:
    runs-on: ubuntu-latest
    env:
      HARNESS_ACCOUNT_URL: ${{ vars.HARNESS_ACCOUNT_URL }}
      HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
      HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
      HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
      HARNESS_SSCA_SERVICE_ENDPOINT: ${{ vars.HARNESS_SSCA_SERVICE_ENDPOINT }}
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
      PLUGIN_REGISTRY: index.docker.io
      OIDC_PROVIDER: non-harness
      FULCIO_URL: ${{ vars.FULCIO_URL }}
      ARTIFACT_SIGNING_PLUGIN_IMAGE: harness/ssca-artifact-signing-plugin:test-githubV2
      ARTIFACT_IMAGE: ${{ vars.DEVSECOPS_TARGET_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign artifact with keyless OIDC
        uses: ./v2/artifact-signing-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          ssca_service_endpoint: ${{ env.HARNESS_SSCA_SERVICE_ENDPOINT }}
          signing_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          keyless_type: non-harness
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify artifact with keyless OIDC
        uses: ./v2/artifact-verification-v2
        with:
          plugin_image: ${{ env.ARTIFACT_SIGNING_PLUGIN_IMAGE }}
          harness_account_url: ${{ env.HARNESS_ACCOUNT_URL }}
          harness_api_key: ${{ env.HARNESS_API_KEY }}
          harness_account_id: ${{ env.HARNESS_ACCOUNT_ID }}
          harness_org_id: ${{ env.HARNESS_ORG_ID }}
          harness_project_id: ${{ env.HARNESS_PROJECT_ID }}
          ssca_service_endpoint: ${{ env.HARNESS_SSCA_SERVICE_ENDPOINT }}
          signing_source: ${{ env.ARTIFACT_IMAGE }}
          registry_type: docker
          keyless_type: non-harness
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
