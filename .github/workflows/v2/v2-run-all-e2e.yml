# Dispatches all V2 E2E workflows (container, non-container, repository × Vault + keyless).
name: "V2 — Run all E2E workflows"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow_file:
          - container-devsecops-slsa-sbom-enforce-vault-kms-v2.yml
          - container-devsecops-slsa-sbom-enforce-keyless-oidc-v2.yml
          - container-artifact-sign-and-verify-vault-kms-v2.yml
          - container-artifact-sign-and-verify-keyless-oidc-v2.yml
          - non-container-sbom-generate-vault-kms-v2.yml
          - non-container-sbom-generate-keyless-oidc-v2.yml
          - non-container-sbom-enforce-vault-kms-v2.yml
          - non-container-sbom-enforce-keyless-oidc-v2.yml
          - non-container-artifact-sign-and-verify-vault-kms-v2.yml
          - non-container-artifact-sign-and-verify-keyless-oidc-v2.yml
          - repository-sbom-generate-vault-kms-v2.yml
          - repository-sbom-generate-keyless-oidc-v2.yml
          - repository-sbom-enforce-vault-kms-v2.yml
          - repository-sbom-enforce-keyless-oidc-v2.yml
    steps:
      - name: Dispatch ${{ matrix.workflow_file }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ".github/workflows/v2/${{ matrix.workflow_file }}" --ref "${{ github.ref_name }}"
